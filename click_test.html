<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Click Test</title>
<style>
body { background: #0a0a0f; color: #fff; font-family: sans-serif; padding: 20px; }
.map-wrap { width: 100%; max-width: 1100px; margin: 0 auto; }
.map-wrap svg { display: block; width: 100%; height: auto; }
g.node { cursor: pointer; }
g.node rect { fill: #111; stroke: #333; }
g.node:hover rect { stroke: #fff; }
g.node.active rect { stroke: #ff9d00; fill: #1a1500; }
text.pack-label { fill: #666; font: 700 9px monospace; }
text.head { fill: #666; font: 700 9px monospace; }
text.title { fill: #fff; font: 700 12px monospace; }
text.body { fill: #888; font: 11px monospace; }
#map-info { margin-top: 10px; padding: 0 14px; border: 1px solid #333; background: rgba(255,157,0,0.04); font-size: 13px; max-height: 0; overflow: hidden; opacity: 0; transition: max-height .3s, opacity .2s; }
#map-info.show { max-height: 400px; opacity: 1; padding: 10px 14px; }
.mi-ti { font: 700 11px monospace; color: #ff9d00; }
.mi-bd { margin-top: 6px; }
.mi-cl { background: transparent; color: #888; border: 1px solid #333; padding: 2px 8px; cursor: pointer; font-size: 9px; }
</style>
</head>
<body>
<h2>Click Test</h2>
<div class="map-wrap">
<svg id="signal-map" viewBox="0 0 400 200">
<g class="node" data-node="n01">
<rect x="10" y="20" width="150" height="50" rx="3"/>
<text class="head" x="20" y="35">NODE 01</text>
<text class="title" x="20" y="55">TEST NODE</text>
</g>
<g class="node" data-node="n02">
<rect x="200" y="20" width="150" height="50" rx="3"/>
<text class="head" x="210" y="35">NODE 02</text>
<text class="title" x="210" y="55">SECOND NODE</text>
</g>
<path class="edge" d="M 160 45 C 175 35, 185 35, 200 45" marker-end="url(#arr)" fill="none" stroke="#ff9d00" stroke-width="1.5" stroke-dasharray="5,5"/>
<defs>
<marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" fill="#ff9d00"/></marker>
</defs>
</svg>
</div>

<script>
(function() {
  var svg = document.getElementById('signal-map');
  if (!svg) { console.log('ERROR: no signal-map found'); return; }
  var nodes = Array.from(svg.querySelectorAll('g.node'));
  console.log('Found ' + nodes.length + ' nodes');
  if (!nodes.length) return;

  var EXPL = {
    "TEST NODE": "This is a test node explanation. It should show when you click.",
    "SECOND NODE": "This is the second node explanation."
  };

  var info = document.getElementById('map-info');
  if (!info) {
    info = document.createElement('div');
    info.id = 'map-info';
    info.innerHTML = '<div><span class="mi-ti"></span> <span class="mi-tg"></span> <button class="mi-cl">close</button></div><div class="mi-bd"></div>';
    svg.parentNode.insertBefore(info, svg.nextSibling);
  }

  nodes.forEach(function(g) {
    g.style.cursor = 'pointer';
    g.addEventListener('click', function(e) {
      e.stopPropagation();
      console.log('CLICKED!');
      nodes.forEach(function(n) { n.classList.remove('active'); });
      g.classList.add('active');
      var ti = g.querySelector('text.title');
      var title = ti ? ti.textContent : '';
      console.log('Title: ' + title);
      info.querySelector('.mi-ti').textContent = title;
      info.querySelector('.mi-bd').textContent = EXPL[title] || 'No explanation found.';
      info.classList.add('show');
      info.style.maxHeight = '800px';
      info.style.opacity = '1';
      info.style.padding = '14px 20px';
    });
  });

  svg.addEventListener('click', function() {
    nodes.forEach(function(n) { n.classList.remove('active'); });
    info.classList.remove('show');
    info.style.maxHeight = '0';
    info.style.opacity = '0';
    info.style.padding = '0 20px';
  });
})();
</script>
</body>
</html>
